<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0" y="0" width="1700" height="760" fill="#FFFFFF"/>
<text x="40" y="52" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">Workflow — Wellness check &#x27;Are you OK?&#x27; (FR-D4)</text>
<text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">From wellness_contract.md. Up to 3 checks a day, local time (Asia/Karachi), grace period 5–180 min (default 30).</text>
<rect x="60" y="170" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="185.0" y="210.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Schedule</text>
<text x="185.0" y="230.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">Primary, or Secondary with</text>
<text x="185.0" y="250.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">emergency_alerts</text>
<rect x="380" y="170" width="260" height="110" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.6"/>
<text x="510.0" y="210.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Check time</text>
<text x="510.0" y="230.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">critical push to the</text>
<text x="510.0" y="250.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">Dependent: &#x27;Are you OK?&#x27;</text>
<rect x="720" y="120" width="280" height="90" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="860.0" y="160.1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">&#x27;I am OK&#x27;</text>
<text x="860.0" y="181.1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">check closes · answered</text>
<rect x="720" y="250" width="280" height="100" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.6"/>
<text x="860.0" y="295.1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Grace period ends</text>
<text x="860.0" y="316.1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">no answer</text>
<line x1="312" y1="225" x2="378" y2="225" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="642" y1="205" x2="718" y2="168" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="645" y="159" width="56.199999999999996" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="650" y="172" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">answers</text>
<line x1="642" y1="250" x2="718" y2="290" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="647" y="279" width="56.199999999999996" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="652" y="292" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">silence</text>
<rect x="1080" y="250" width="290" height="100" rx="10" fill="#CCFBF1" stroke="#115E59" stroke-width="1.6"/>
<text x="1225.0" y="285.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Device active?</text>
<text x="1225.0" y="305.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">any location fix in the</text>
<text x="1225.0" y="325.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">last 30 minutes</text>
<line x1="1002" y1="300" x2="1078" y2="300" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="1440" y="140" width="220" height="90" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="1550.0" y="180.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Closes quietly</text>
<text x="1550.0" y="200.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">device_active · no alert</text>
<rect x="1440" y="330" width="220" height="110" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.6"/>
<text x="1550.0" y="370.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">ESCALATED</text>
<text x="1550.0" y="390.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">critical alert to the Primary</text>
<text x="1550.0" y="410.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">→ escalation chain (D4)</text>
<line x1="1372" y1="280" x2="1438" y2="200" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="1385" y="217" width="29.799999999999997" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="1390" y="230" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">yes</text>
<line x1="1372" y1="320" x2="1438" y2="375" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="1390" y="349" width="23.2" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="1395" y="362" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">no</text>
<rect x="1080" y="500" width="580" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="1370.0" y="530.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Late answer</text>
<text x="1370.0" y="549.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Dependent says &#x27;I am OK&#x27; after escalation → alert closes,</text>
<text x="1370.0" y="568.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">everyone who was told gets a standard all-clear</text>
<line x1="1550" y1="442" x2="1550" y2="498" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="60" y="500" width="560" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="340.0" y="540.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Default schedule button</text>
<text x="340.0" y="559.4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">08:00 · 14:00 · 20:00 with 30 min grace (only if none exist)</text>
<text x="60" y="680" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Why the activity check: an older person who is walking around but missed the tap should not set off an alarm (fewer false alerts).</text>
<text x="60" y="710" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Screens: 22 Wellness check (Dependent) · 13b Wellness checks, 08 Alerts (Guardian).</text>
</svg>
