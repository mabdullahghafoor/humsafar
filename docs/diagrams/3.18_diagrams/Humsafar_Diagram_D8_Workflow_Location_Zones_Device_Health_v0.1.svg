<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="860" viewBox="0 0 1700 860"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0" y="0" width="1700" height="860" fill="#FFFFFF"/>
<text x="40" y="52" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">Workflow — Location, safe zones and device health (FR-C1–C4, FR-L1, FR-L2)</text>
<text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">From location_contract.md, geofence_contract.md and device_health_contract.md. One location fix feeds three features.</text>
<rect x="60" y="180" width="270" height="130" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.6"/>
<text x="195.0" y="220.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Dependent&#x27;s phone</text>
<text x="195.0" y="240.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">sends a fix:</text>
<text x="195.0" y="260.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">lat, lng, accuracy,</text>
<text x="195.0" y="280.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">speed, battery %</text>
<rect x="420" y="180" width="300" height="130" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="570.0" y="230.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Server stores the fix</text>
<text x="570.0" y="250.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">and works out:</text>
<text x="570.0" y="270.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">moving / stationary / idle</text>
<line x1="332" y1="245" x2="418" y2="245" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="376.0" y="226.0" width="109.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="381.0" y="239.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">POST …/location</text>
<path d="M 570 312 L 570 360 L 200 360 L 200 314" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="230" y="352" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">reply: next_update_interval_s  (moving 10 s · stationary 60 s · idle 180 s)</text>
<rect x="820" y="120" width="380" height="110" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="1010.0" y="160.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Safe zones (geofence)</text>
<text x="1010.0" y="179.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">inside any zone = safe; outside all = breach</text>
<text x="1010.0" y="198.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">one breach per episode · GPS error allowed</text>
<rect x="820" y="260" width="380" height="110" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="1010.0" y="300.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Low battery</text>
<text x="1010.0" y="319.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">opens at 15% or lower, closes above 20%</text>
<text x="1010.0" y="338.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">phone then reports at least every 60 s</text>
<rect x="820" y="400" width="380" height="110" rx="10" fill="#CCFBF1" stroke="#115E59" stroke-width="1.6"/>
<text x="1010.0" y="440.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Offline</text>
<text x="1010.0" y="459.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">no fix for 10 minutes</text>
<text x="1010.0" y="478.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">(scheduler checks every minute)</text>
<line x1="722" y1="220" x2="818" y2="175" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="722" y1="250" x2="818" y2="315" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 722 290 C 770 330 770 420 818 455" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="1290" y="120" width="360" height="110" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.6"/>
<text x="1470.0" y="160.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Guardian</text>
<text x="1470.0" y="179.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">amber &#x27;left all safe zones&#x27;</text>
<text x="1470.0" y="198.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Live Map + geofence-status</text>
<rect x="1290" y="260" width="360" height="110" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.6"/>
<text x="1470.0" y="300.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Guardian</text>
<text x="1470.0" y="319.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">battery chip turns amber;</text>
<text x="1470.0" y="338.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">last-known location kept</text>
<rect x="1290" y="400" width="360" height="110" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.6"/>
<text x="1470.0" y="440.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Guardian</text>
<text x="1470.0" y="459.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">&#x27;Phone offline since …&#x27;</text>
<text x="1470.0" y="478.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">last-known location shown</text>
<line x1="1202" y1="175" x2="1288" y2="175" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="1202" y1="315" x2="1288" y2="315" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="1202" y1="455" x2="1288" y2="455" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="60" y="600" width="520" height="110" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="320.0" y="640.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Who sees what</text>
<text x="320.0" y="659.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Primary: everything, creates / edits zones (max 10)</text>
<text x="320.0" y="678.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Secondary: view only, needs live_location permission</text>
<rect x="640" y="600" width="520" height="110" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="900.0" y="640.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">History</text>
<text x="900.0" y="659.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">every fix is kept → route for a chosen day</text>
<text x="900.0" y="678.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">(Location history screen 11c)</text>
<rect x="1220" y="600" width="430" height="110" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="1435.0" y="640.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Last-known location</text>
<text x="1435.0" y="659.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">phone sends one fix on low battery / shutdown;</text>
<text x="1435.0" y="678.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">the newest fix is the last-known place</text>
<text x="60" y="790" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Rules: the newest fix always decides (a late buffered fix cannot open or close an alert) · a repeated fix is stored once · leaving a zone is amber, not red.</text>
<text x="60" y="820" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Screens: 11 Live Map, 11b Left zones, 11c History, 12 Safe zones, 12b Edit zone (2.8 mockups).</text>
</svg>
