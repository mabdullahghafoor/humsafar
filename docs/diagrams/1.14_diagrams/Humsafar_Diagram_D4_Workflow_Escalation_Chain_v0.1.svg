<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0" y="0" width="1700" height="820" fill="#FFFFFF"/>
<text x="40" y="52" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">Workflow — Alert escalation chain (FR-D5, FR-R1)</text>
<text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">Missed dose or missed wellness check climbs the chain until a Guardian opens it. Timers are 5 + 5 minutes; the server checks once a minute.</text>
<rect x="60" y="170" width="260" height="110" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.6"/>
<text x="190.0" y="209.6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Alert opens</text>
<text x="190.0" y="230.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">missed dose (30-min window)</text>
<text x="190.0" y="251.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">or missed wellness check</text>
<rect x="400" y="170" width="260" height="110" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="530.0" y="209.6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Level 1 — Primary</text>
<text x="530.0" y="230.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">critical push to the</text>
<text x="530.0" y="251.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Primary Guardian</text>
<rect x="760" y="170" width="280" height="110" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="900.0" y="209.6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Level 2 — Secondary</text>
<text x="900.0" y="230.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Secondaries with the</text>
<text x="900.0" y="251.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">emergency_alerts permission</text>
<rect x="1140" y="170" width="300" height="110" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-width="1.6"/>
<text x="1290.0" y="209.6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Level 3 — External contact</text>
<text x="1290.0" y="230.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">ONE SMS to the contact;</text>
<text x="1290.0" y="251.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Primary told the result</text>
<line x1="322" y1="225" x2="398" y2="225" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="662" y1="225" x2="758" y2="225" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="625" y="195" width="135.39999999999998" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="630" y="208" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">not opened in 5 min</text>
<line x1="1042" y1="225" x2="1138" y2="225" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="1005" y="195" width="135.39999999999998" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="1010" y="208" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">not opened in 5 min</text>
<rect x="560" y="400" width="560" height="100" rx="10" fill="#CCFBF1" stroke="#115E59" stroke-width="1.6"/>
<text x="840.0" y="445.1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">A Guardian opens it  →  chain STOPS</text>
<text x="840.0" y="466.1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">tap the notification, or POST /escalations/{id}/acknowledge</text>
<line x1="530" y1="282" x2="680" y2="398" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="900" y1="282" x2="860" y2="398" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="1180" y="400" width="440" height="120" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="1400.0" y="436.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">SMS outcomes</text>
<text x="1400.0" y="455.4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">sent → Primary: &#x27;Emergency contact messaged&#x27;</text>
<text x="1400.0" y="474.4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">no contact → critical: &#x27;No emergency contact set&#x27;</text>
<text x="1400.0" y="493.4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">gateway down → retry 3× then critical alert</text>
<line x1="1290" y1="282" x2="1290" y2="398" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="60" y="400" width="400" height="120" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.6"/>
<text x="260.0" y="434.1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">PANIC (FR-D2)</text>
<text x="260.0" y="455.1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">every linked Guardian at once,</text>
<text x="260.0" y="476.1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">whatever their permissions →</text>
<text x="260.0" y="497.1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">goes straight to Level 3</text>
<path d="M 462 460 C 700 620 1100 620 1290 522" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="60" y="600" width="600" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="360.0" y="640.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Guardian shortcuts on a missed dose</text>
<text x="360.0" y="660.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">extend (give more time)  ·  escalate now (start Level 2 timer)</text>
<text x="60" y="760" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Rules: a level with nobody to tell is skipped · the Dependent is never told about their own alert · when the alert closes after the SMS, an all-clear SMS follows.</text>
</svg>
