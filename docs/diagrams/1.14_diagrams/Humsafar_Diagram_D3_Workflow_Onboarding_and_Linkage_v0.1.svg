<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="860" viewBox="0 0 1700 860"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0" y="0" width="1700" height="860" fill="#FFFFFF"/>
<text x="40" y="52" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">Workflow — Registration, KYC and Guardian linkage (ICP-1 flow)</text>
<text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">From the auth, KYC, linkage and permissions contracts in docs/api/. Dependent can log in only when KYC is verified AND a Primary Guardian has linked them.</text>
<rect x="40" y="120" width="1620" height="200" rx="8" fill="#DBEAFE" fill-opacity="0.25" stroke="#1E3A8A" stroke-width="1"/>
<rect x="40" y="120" width="150" height="200" rx="8" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1"/>
<text x="115" y="225.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Dependent</text>
<rect x="40" y="340" width="1620" height="200" rx="8" fill="#DCFCE7" fill-opacity="0.25" stroke="#166534" stroke-width="1"/>
<rect x="40" y="340" width="150" height="200" rx="8" fill="#DCFCE7" stroke="#166534" stroke-width="1"/>
<text x="115" y="445.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Primary Guardian</text>
<rect x="40" y="560" width="1620" height="200" rx="8" fill="#E0E7FF" fill-opacity="0.25" stroke="#3730A3" stroke-width="1"/>
<rect x="40" y="560" width="150" height="200" rx="8" fill="#E0E7FF" stroke="#3730A3" stroke-width="1"/>
<text x="115" y="665.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Server</text>
<rect x="220" y="170" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="320.0" y="210.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">1. Register</text>
<text x="320.0" y="230.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">role = dependent</text>
<rect x="460" y="170" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="570.0" y="210.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">2. KYC</text>
<text x="570.0" y="230.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">CNIC + live photo</text>
<rect x="720" y="170" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="830.0" y="210.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">3. Share my ID</text>
<text x="830.0" y="230.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">show QR / user_id</text>
<rect x="1380" y="170" width="220" height="90" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="1490.0" y="210.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">8. Log in</text>
<text x="1490.0" y="230.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">Dependent Mode home</text>
<rect x="220" y="390" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="320.0" y="430.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">A. Register</text>
<text x="320.0" y="450.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">becomes Primary</text>
<rect x="460" y="390" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="570.0" y="430.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">B. Verify</text>
<text x="570.0" y="450.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">phone OTP + CNIC</text>
<rect x="980" y="390" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="1080.0" y="430.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">5. Link</text>
<text x="1080.0" y="450.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">scan / type the ID</text>
<rect x="1220" y="390" width="230" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="1335.0" y="430.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">7. Set permissions</text>
<text x="1335.0" y="450.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">for Secondary Guardians</text>
<rect x="690" y="610" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="800.0" y="645.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">KYC result</text>
<text x="800.0" y="664.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">verified / pending / failed</text>
<text x="800.0" y="683.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">(retry on failed)</text>
<rect x="980" y="610" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="1080.0" y="645.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">6. Activate account</text>
<text x="1080.0" y="664.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">verified + linked</text>
<text x="1080.0" y="683.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">= active</text>
<rect x="1220" y="610" width="230" height="100" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.6"/>
<text x="1335.0" y="645.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Rules enforced</text>
<text x="1335.0" y="664.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">1 Primary + max 2 Secondary</text>
<text x="1335.0" y="683.9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Panic ignores permissions</text>
<line x1="422" y1="215" x2="458" y2="215" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="650" y1="262" x2="780" y2="608" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="682" y1="215" x2="718" y2="215" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="679" y="192" width="82.6" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="684" y="205" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">if verified</text>
<line x1="422" y1="435" x2="458" y2="435" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 942 215 C 1000 215 1000 300 1080 388" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1010" y="300" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">4. Guardian sees the ID</text>
<line x1="1080" y1="482" x2="1080" y2="608" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 1080 712 L 1080 742 L 1630 742 L 1630 215 L 1602 215" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1470" y="735" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">now able to log in</text>
<line x1="1182" y1="435" x2="1218" y2="435" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="1335" y1="482" x2="1335" y2="608" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="220" y="800" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Open points (sds_clarifications): no Dependent consent step when a Guardian links (item 9); login error never says which field was wrong; access token 15 min → refresh once and retry.</text>
</svg>
