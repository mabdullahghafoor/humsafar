<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0" y="0" width="1700" height="760" fill="#FFFFFF"/>
<text x="40" y="52" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">Workflow — Medication dose: reminder, two-step confirmation, missed dose (FR-F1, FR-D1)</text>
<text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start">From medication_contract.md. Only the Dependent confirms a dose; Guardians (Primary, or Secondary with medication_management) manage schedules.</text>
<rect x="60" y="160" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="185.0" y="195.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Schedule</text>
<text x="185.0" y="215.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">set by a Guardian</text>
<text x="185.0" y="235.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">times + drug + dose</text>
<rect x="380" y="160" width="260" height="100" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.6"/>
<text x="510.0" y="195.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Reminder</text>
<text x="510.0" y="215.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">standard push</text>
<text x="510.0" y="235.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">15 min before</text>
<rect x="710" y="160" width="260" height="100" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.6"/>
<text x="840.0" y="195.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Dose due</text>
<text x="840.0" y="215.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">critical push at the time,</text>
<text x="840.0" y="235.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">repeats until confirmed</text>
<rect x="1040" y="120" width="280" height="80" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="1180.0" y="155.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Step 1: &#x27;I took it&#x27;</text>
<text x="1180.0" y="175.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">confirm-request</text>
<rect x="1040" y="220" width="280" height="80" rx="10" fill="#DCFCE7" stroke="#166534" stroke-width="1.6"/>
<text x="1180.0" y="255.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Step 2: &#x27;Yes, confirm&#x27;</text>
<text x="1180.0" y="275.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">confirm → TAKEN</text>
<rect x="1400" y="160" width="240" height="100" rx="10" fill="#CCFBF1" stroke="#115E59" stroke-width="1.6"/>
<text x="1520.0" y="195.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Recorded</text>
<text x="1520.0" y="215.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">adherence data</text>
<text x="1520.0" y="235.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">(Analytics, Phase 7)</text>
<line x1="312" y1="210" x2="378" y2="210" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="642" y1="210" x2="708" y2="210" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="972" y1="190" x2="1038" y2="160" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="1180" y1="202" x2="1180" y2="218" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="1322" y1="260" x2="1398" y2="220" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="710" y="400" width="260" height="110" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.6"/>
<text x="840.0" y="440.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Window ends</text>
<text x="840.0" y="460.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">30 min, no confirmation</text>
<text x="840.0" y="480.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">→ MISSED</text>
<line x1="840" y1="262" x2="840" y2="398" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="843" y="311.0" width="109.0" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
<text x="848" y="324.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">no confirmation</text>
<rect x="1040" y="400" width="280" height="110" rx="10" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.6"/>
<text x="1180.0" y="440.25" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Primary alerted</text>
<text x="1180.0" y="460.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">critical &#x27;Missed dose&#x27;</text>
<text x="1180.0" y="480.25" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">→ escalation chain</text>
<line x1="972" y1="455" x2="1038" y2="455" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="1400" y="380" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="1520.0" y="410.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Extend</text>
<text x="1520.0" y="429.4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">more time for the Dependent</text>
<rect x="1400" y="470" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="1520.0" y="500.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Escalate now</text>
<text x="1520.0" y="519.4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">tell Secondaries</text>
<line x1="1322" y1="430" x2="1398" y2="415" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="1322" y1="480" x2="1398" y2="505" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="60" y="620" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Why two steps: one accidental tap must not mark a dose as taken (FR-F1.3).  A late confirmation is still recorded and closes the alert.</text>
<text x="60" y="650" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Dependent screens: 20 Dependent Home → 23 Medicine confirmation.   Guardian screens: 07 Dashboard, 08 Alerts, 13 Care schedules (see 0.7 wireframes).</text>
</svg>
