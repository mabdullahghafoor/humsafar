<text x="324" y="62" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#0E7490" text-anchor="middle">EN|UR</text>
<circle cx="180.0" cy="172" r="48" fill="#ECFEFF"/>
<rect x="162.0" y="159.4" width="36.0" height="27.0" rx="3" fill="none" stroke="#0E7490" stroke-width="2"/>
<circle cx="180.0" cy="172" r="7.2" fill="none" stroke="#0E7490" stroke-width="2"/>
<text x="180.0" y="244" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="middle">No camera set up yet</text>
<text x="20" y="274" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">To set it up</text>
<circle cx="32" cy="306" r="11" fill="#0E7490"/>
<text x="32" y="310" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="52" y="311" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Sign in as Ammi on a spare Android phone</text>
<circle cx="32" cy="338" r="11" fill="#0E7490"/>
<text x="32" y="342" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="52" y="343" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Open Camera mode and tap Pair</text>
<circle cx="32" cy="370" r="11" fill="#0E7490"/>
<text x="32" y="374" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="52" y="375" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Place it on charge, pointing at the room</text>
