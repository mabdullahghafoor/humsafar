<text x="36" y="421" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">When 3 Guardians are already watching</text>
<text x="36" y="441" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">you see &quot;Camera busy, try again shortly&quot;.</text>
<rect x="20" y="470" width="320" height="64" rx="12" fill="#ECFEFF"/>
<circle cx="42" cy="493" r="9.0" fill="none" stroke="#0E7490" stroke-width="1.8"/>
<line x1="42" y1="492" x2="42" y2="497" stroke="#0E7490" stroke-width="2"/>
<circle cx="42" cy="488.5" r="1.2" fill="#0E7490"/>
<text x="62" y="498" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E7490" text-anchor="start">Only Ammi or the Primary can pair</text>
<text x="62" y="518" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Video starts only while someone watches</text>
