<text x="340" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end">100%</text>
<rect x="0" y="30" width="360" height="56" rx="0" fill="#FFFFFF"/>
