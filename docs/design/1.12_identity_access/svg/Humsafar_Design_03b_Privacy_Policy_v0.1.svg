<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>03b Privacy Policy</title>
<rect x="0" y="0" width="360" height="780" fill="#F8FAFC"/>
<text x="20" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start" >9:41</text><text x="340" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end" >100%</text>
<rect x="0" y="30" width="360" height="56" fill="#FFFFFF"/><line x1="0" y1="86" x2="360" y2="86" stroke="#CBD5E1" stroke-width="1"/>
<path d="M 30 52 L 22 58 L 30 64" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="64" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start" >Privacy Policy</text>
<rect x="256" y="44" width="40" height="28" rx="14" fill="#ECFEFF" stroke="#0E7490" stroke-width="1"/><text x="276" y="63" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0E7490" text-anchor="middle" >Aa</text>
<rect x="302" y="44" width="44" height="28" rx="14" fill="#ECFEFF" stroke="#0E7490" stroke-width="1"/><text x="324" y="62" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#0E7490" text-anchor="middle" >EN|UR</text>
<text x="20" y="112" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >Version 0.1 · 23 Nov 2026 · Draft</text>
<text x="20" y="138" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >What this is</text>
<text x="20" y="158" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >Humsafar helps a family look after someone they</text>
<text x="20" y="177" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >love. It is a final-year university project, so this is a</text>
<text x="20" y="196" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >prototype.</text>
<text x="20" y="226" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >What we collect</text>
<circle cx="25" cy="242" r="2" fill="#475569"/>
<text x="36" y="246" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >Your name, email, phone and password (stored</text>
<text x="36" y="265" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >scrambled).</text>
<circle cx="25" cy="283" r="2" fill="#475569"/>
<text x="36" y="287" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >For a Dependent: a CNIC number and a live</text>
<text x="36" y="306" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >photo to check who they are.</text>
<circle cx="25" cy="324" r="2" fill="#475569"/>
<text x="36" y="328" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >The Dependent&#x27;s phone location.</text>
<circle cx="25" cy="346" r="2" fill="#475569"/>
<text x="36" y="350" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >Health information a Guardian or Dependent</text>
<text x="36" y="369" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >enters: medicines, readings, records,</text>
<text x="36" y="388" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >appointments.</text>
<circle cx="25" cy="406" r="2" fill="#475569"/>
<text x="36" y="410" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >Messages, camera video while watched, short</text>
<text x="36" y="429" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >clips after an alarm.</text>
<text x="20" y="459" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >Why we collect it</text>
<text x="20" y="479" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >To keep the Dependent safe: alert Guardians, send</text>
<text x="20" y="498" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >reminders, show where they are. We do not sell</text>
<text x="20" y="517" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >your data and we show no ads.</text>
<text x="20" y="547" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >Who can see it</text>
<circle cx="25" cy="563" r="2" fill="#475569"/>
<text x="36" y="567" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >The Primary Guardian sees everything about</text>
<text x="36" y="586" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >their Dependent.</text>
<circle cx="25" cy="604" r="2" fill="#475569"/>
<text x="36" y="608" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >A Secondary Guardian sees only what the</text>
<text x="36" y="627" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >Primary allows.</text>
<circle cx="25" cy="645" r="2" fill="#475569"/>
<text x="36" y="649" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >The Dependent sees their own information.</text>
<text x="20" y="679" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >How long we keep it</text>
<text x="20" y="699" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >While your account is open, then 60 days after it is</text>
<text x="20" y="718" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >closed.</text>
<defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC" stop-opacity="0"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient></defs>
<rect x="0" y="690" width="360" height="90" fill="url(#f)"/>
<rect x="350" y="100" width="4" height="170" rx="2" fill="#CBD5E1"/>
<text x="180" y="740" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >Scrolls. Full text in the Privacy and Terms document.</text>
</svg>