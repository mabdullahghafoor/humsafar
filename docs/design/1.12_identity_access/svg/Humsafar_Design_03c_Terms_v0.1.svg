<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>03c Terms</title>
<rect x="0" y="0" width="360" height="780" fill="#F8FAFC"/>
<text x="20" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start" >9:41</text><text x="340" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end" >100%</text>
<rect x="0" y="30" width="360" height="56" fill="#FFFFFF"/><line x1="0" y1="86" x2="360" y2="86" stroke="#CBD5E1" stroke-width="1"/>
<path d="M 30 52 L 22 58 L 30 64" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="64" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start" >Terms</text>
<rect x="256" y="44" width="40" height="28" rx="14" fill="#ECFEFF" stroke="#0E7490" stroke-width="1"/><text x="276" y="63" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0E7490" text-anchor="middle" >Aa</text>
<rect x="302" y="44" width="44" height="28" rx="14" fill="#ECFEFF" stroke="#0E7490" stroke-width="1"/><text x="324" y="62" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#0E7490" text-anchor="middle" >EN|UR</text>
<text x="20" y="112" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >Version 0.1 · 23 Nov 2026 · Draft</text>
<text x="20" y="138" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >A prototype</text>
<text x="20" y="158" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >Humsafar is a student project. It can change, stop</text>
<text x="20" y="177" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >working or lose test data. It is provided as it is.</text>
<text x="20" y="207" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >Who can use it</text>
<text x="20" y="227" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >Guardians must be 18 or older. A Guardian may link</text>
<text x="20" y="246" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >a Dependent only with that person&#x27;s knowledge and</text>
<text x="20" y="265" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >agreement.</text>
<text x="20" y="295" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >Your responsibilities</text>
<text x="20" y="315" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >Give correct information. Keep your password</text>
<text x="20" y="334" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >private. Do not use Humsafar to track or watch</text>
<text x="20" y="353" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >someone who does not know. Do not use it for</text>
<text x="20" y="372" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >anything illegal.</text>
<text x="20" y="402" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >It is not an emergency service</text>
<text x="20" y="422" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >The Panic button and alerts can be delayed by the</text>
<text x="20" y="441" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >internet, the phone or its battery. In a real</text>
<text x="20" y="460" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >emergency, also call Edhi 115, Rescue 1122 or Police</text>
<text x="20" y="479" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >15.</text>
<text x="20" y="509" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >Health information</text>
<text x="20" y="529" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >What you enter is for your own records. It is not</text>
<text x="20" y="548" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >medical advice.</text>
<text x="20" y="578" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75" text-anchor="start" >Accounts</text>
<text x="20" y="598" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >You can close your account at any time. We may</text>
<text x="20" y="617" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start" >close an account that is misused.</text>
<defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC" stop-opacity="0"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient></defs>
<rect x="0" y="690" width="360" height="90" fill="url(#f)"/>
<rect x="350" y="100" width="4" height="170" rx="2" fill="#CBD5E1"/>
<text x="180" y="740" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" >Scrolls. Full text in the Privacy and Terms document.</text>
</svg>