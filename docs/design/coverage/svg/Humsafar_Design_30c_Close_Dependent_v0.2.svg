<text x="40" y="306" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#0F172A" text-anchor="start">After 60 days her data is deleted and</text>
<text x="40" y="328" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#0F172A" text-anchor="start">cannot be brought back.</text>
