<text x="40" y="240" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#0F172A" text-anchor="start">All Guardians lose access; Secondaries</text>
<text x="40" y="262" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#0F172A" text-anchor="start">are told. Doctor links stop working.</text>
