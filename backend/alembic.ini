# Alembic configuration for Humsafar (Task 1.2).
# Run all alembic commands from the backend/ folder with the venv active.
# The database URL is NOT stored here: alembic/env.py reads DATABASE_URL from
# your .env via app.core.config, so no credentials are ever committed.

[alembic]
script_location = alembic
prepend_sys_path = .
# Migration files are named with a timestamp prefix so they sort in order.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
